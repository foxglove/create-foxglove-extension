name: CI

on:
  push:
    branches: main
    tags: v*
  pull_request:
    # "**" also matches base branches that contain a slash, such as those of stacked PRs
    branches: "**"

jobs:
  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4.2.2

      - run: corepack enable

      - name: Configure Node.js
        uses: actions/setup-node@v4.1.0
        with:
          node-version: 24.x
          cache: yarn

      - run: yarn install --immutable
      # tsc checks with TypeScript 5, which builds use, and lint:ci runs `vp check`, which type checks
      # with TypeScript 7. Both run because the two versions can disagree.
      - run: yarn run tsc --noEmit
      - run: yarn lint:ci

  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4.2.2

      - run: corepack enable

      - name: Configure Node.js
        uses: actions/setup-node@v4.1.0
        with:
          node-version: 24.x
          cache: yarn

      - run: yarn install --immutable
      - name: test
        run: yarn test

  e2e:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-22.04
          - windows-2022

    name: e2e (${{ matrix.os }})

    steps:
      - uses: actions/checkout@v4.2.2

      # On windows we need to run `corepack enable` after setup-node and on linux we need
      # to run it before. On linux it is ok to run it after as well.
      - run: corepack enable
        if: matrix.os == 'windows-2022'

      - name: Configure Node.js
        uses: actions/setup-node@v4.1.0
        with:
          node-version: 24.x

      - run: corepack enable

      - run: yarn install --immutable

      # pack into tarball so we can use it with npx
      - run: yarn pack

      # install this build of create-foxglove-extension into the sample instead of the published release
      - name: create sample extension
        run: npx package.tgz sample --create-foxglove-extension-package package.tgz

      # confirm that the generated extension code passes format, lint, and type checks
      - name: check generated extension code
        working-directory: sample
        run: npm run check

      # confirm that the generated extension builds in development mode
      - name: build generated extension
        working-directory: sample
        run: npm run build

      # confirm that the generated extension code can be packaged
      - name: package generated extension
        working-directory: sample
        run: npm run package
